name: base16ct

on:
  pull_request:
    paths:
      - ".github/workflows/base16ct.yml"
      - "base16ct/**"
      - "Cargo.*"
  push:
    branches: master

defaults:
  run:
    working-directory: base16ct

env:
  CARGO_INCREMENTAL: 0
  RUSTFLAGS: "-Dwarnings"

# Cancels CI jobs when new commits are pushed to a PR branch
concurrency:
  group: ${{ github.workflow }}-${{ github.head_ref || github.run_id }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        rust:
          - 1.85.0 # MSRV
          - stable
        target:
          - thumbv7em-none-eabi
          - wasm32-unknown-unknown
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack build --target ${{ matrix.target }} --feature-powerset

  minimal-versions:
    uses: RustCrypto/actions/.github/workflows/minimal-versions.yml@master
    with:
      working-directory: ${{ github.workflow }}

  test:
    strategy:
      # Otherwise one target's failure cancels the others, hiding whether they
      # would have passed.
      fail-fast: false
      matrix:
        include:
          # `x86_64` Linux
          - target: x86_64-unknown-linux-gnu
            rust: 1.85.0 # MSRV
          - target: x86_64-unknown-linux-gnu
            rust: stable

          # `x86` Linux (32-bit)
          - target: i686-unknown-linux-gnu
            rust: 1.85.0 # MSRV
            deps: sudo apt update && sudo apt install gcc-multilib
          - target: i686-unknown-linux-gnu
            rust: stable
            deps: sudo apt update && sudo apt install gcc-multilib

          # `aarch64` Linux
          - target: aarch64-unknown-linux-gnu
            rust: 1.85.0 # MSRV
            runner: ubuntu-24.04-arm
          - target: aarch64-unknown-linux-gnu
            rust: stable
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner != '' && matrix.runner || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: ${{ matrix.rust }}
          targets: ${{ matrix.target }}
      - run: ${{ matrix.deps }}
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack test --target ${{ matrix.target }} --feature-powerset
      - run: cargo test --target ${{ matrix.target }} --all-features --release
      # `RUSTFLAGS` set here replaces the workflow-level value, so `-Dwarnings`
      # has to be repeated.
      - run: cargo test --target ${{ matrix.target }} --all-features
        env:
          RUSTFLAGS: '-Dwarnings --cfg base16ct_backend="soft"'

  # Interpreting the backends under Miri is how the AVX-512 paths will be
  # covered, since no CI runner is guaranteed to have that hardware.
  test-miri:
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: "-Zmiri-symbolic-alignment-check -Zmiri-strict-provenance"
    strategy:
      matrix:
        target:
          - x86_64-unknown-linux-gnu
          - aarch64-unknown-linux-gnu
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      - run: cargo miri setup --target ${{ matrix.target }}
      - run: cargo miri test --target ${{ matrix.target }} --all-features --lib
      - run: cargo miri test --target ${{ matrix.target }} --all-features --lib
        env:
          RUSTFLAGS: '-Dwarnings --cfg base16ct_backend="soft"'

  # Force each x86 tier rather than relying on whatever the runner happens to
  # support, so a tier cannot silently go untested. The unit tests assert rather
  # than skip when a feature is enabled at compile time, so a misconfigured leg
  # here fails instead of passing vacuously.
  test-x86-backends:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - backend: x86-ssse3
            features: ssse3
          - backend: x86-avx2
            features: avx2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: x86_64-unknown-linux-gnu
      - uses: taiki-e/install-action@cargo-hack
      # Autodetect build, with the tier available to be detected.
      - run: cargo hack test --feature-powerset
        env:
          RUSTFLAGS: "-Dwarnings -Ctarget-feature=+${{ matrix.features }}"
          RUSTDOCFLAGS: "-Dwarnings -Ctarget-feature=+${{ matrix.features }}"
      # Pinned build, which also proves the `compile_error!` guard is satisfied.
      - run: cargo test --all-features
        env:
          RUSTFLAGS: '-Dwarnings -Ctarget-feature=+${{ matrix.features }} --cfg base16ct_backend="${{ matrix.backend }}"'
          RUSTDOCFLAGS: '-Dwarnings -Ctarget-feature=+${{ matrix.features }} --cfg base16ct_backend="${{ matrix.backend }}"'

  # AVX2 is interpreted rather than executed here: Miri runs the intrinsics
  # without needing the hardware, which is how the wider tiers stay covered.
  test-x86-miri:
    runs-on: ubuntu-latest
    env:
      MIRIFLAGS: "-Zmiri-symbolic-alignment-check -Zmiri-strict-provenance"
    strategy:
      matrix:
        features:
          - ssse3
          - avx2
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: nightly
          components: miri
      - run: cargo miri setup
      - run: cargo miri test --all-features --lib
        env:
          RUSTFLAGS: "-Ctarget-feature=+${{ matrix.features }}"

  # Verify the constant-time claim rather than arguing it. Inputs are marked
  # undefined, so memcheck reports any branch or address derived from their
  # contents; the only value unpoisoned is the error accumulator, which is
  # already observable through the returned `Result`.
  #
  # Lives in its own crate outside the workspace, so that the Valgrind and
  # libclang requirement stays confined to this job.
  test-ct-valgrind:
    strategy:
      matrix:
        include:
          - target: x86_64-unknown-linux-gnu
          - target: aarch64-unknown-linux-gnu
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner != '' && matrix.runner || 'ubuntu-latest' }}
    defaults:
      run:
        working-directory: base16ct/ct-tests
    env:
      # Release build, so what is checked is the codegen that ships.
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_GNU_RUNNER: "valgrind --tool=memcheck --error-exitcode=1 --leak-check=no --errors-for-leak-kinds=none"
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_GNU_RUNNER: "valgrind --tool=memcheck --error-exitcode=1 --leak-check=no --errors-for-leak-kinds=none"
    steps:
      - uses: actions/checkout@v7
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: ${{ matrix.target }}
      # `crabgrind` binds the Valgrind client-request macros via bindgen.
      - run: sudo apt-get update && sudo apt-get install -y valgrind libclang-dev clang
      - run: cargo test --release --target ${{ matrix.target }}

  # Test WASM using `wasmtime`, with and without `simd128`, so both the SIMD
  # and the fallback path are exercised.
  test-wasm:
    runs-on: ubuntu-latest
    env:
      CARGO_TARGET_WASM32_WASIP1_RUNNER: "wasmtime"
    strategy:
      matrix:
        flags:
          - "-Dwarnings -Ctarget-feature=-simd128"
          - "-Dwarnings -Ctarget-feature=+simd128"
    steps:
      - uses: actions/checkout@v7
      - uses: bytecodealliance/actions/wasmtime/setup@v1
      - uses: dtolnay/rust-toolchain@master
        with:
          toolchain: stable
          targets: wasm32-wasip1
      - uses: taiki-e/install-action@cargo-hack
      - run: cargo hack test --target wasm32-wasip1 --feature-powerset
        env:
          RUSTFLAGS: ${{ matrix.flags }}
          # `RUSTDOCFLAGS` does not inherit `RUSTFLAGS`, so doctests would
          # otherwise silently run without the target feature under test.
          RUSTDOCFLAGS: ${{ matrix.flags }}
